name: 'Check - Run ESLint'

on:
  pull_request:

jobs:
  check-eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: 'Install Node'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: 'Install Deps'
        run: npm ci
      - name: 'Lint'
        run: npm run lint
